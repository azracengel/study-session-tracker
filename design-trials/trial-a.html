
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker Design A</title>
  <style>
    body {
      background: #f7f5ff;
      color: #25213f;
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 16px 0;
      box-shadow: 0 4px 16px #e9e2ff;
    }
    .stat {
      color: #7864c8;
      font-size: 32px;
      font-weight: bold;
    }
    button {
      background: #7864c8;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>StudyFlow</h1>
  <p>Your personal study session tracker</p>
  <div class="card">
    <h2>This Week</h2>
    <div class="stat">0 hr 0 min</div>
  </div>
  <div class="card">
    <h2>Log a Study Session</h2>
    <p>Subject: __________</p>
    <p>Minutes: __________</p>
    <button>Log Session</button>
  </div>
  <div class="card">
    <h2>Study History</h2>
    <p>No sessions yet.</p>
  </div>
</body>
</html>
