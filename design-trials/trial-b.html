
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker Design B</title>
  <style>
    body {
      background: #f5f4f0;
      color: #1e1b4b;
      font-family: Georgia, serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 24px;
      border: 1px solid #ddd8d0;
      margin: 16px 0;
      border-radius: 6px;
    }
    .stat {
      color: #4f46e5;
      font-size: 32px;
      font-weight: bold;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
    }
  </style>
</head>
<body>
  <h1>Study Session Tracker</h1>
  <p>Track your study time, one session at a time.</p>
  <div class="card">
    <h2>Weekly Total</h2>
    <div class="stat">0 hr 0 min</div>
  </div>
  <div class="card">
    <h2>New Session</h2>
    <p>Subject: __________</p>
    <p>Minutes: __________</p>
    <button>Save Session</button>
  </div>
  <div class="card">
    <h2>History</h2>
    <p>No sessions yet.</p>
  </div>
</body>
</html>
